<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4f46e5" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#grad)" />
  
  <!-- Stylized Queue Symbol (Letter D merged with a ticket & people) -->
  <g transform="translate(106, 106)" filter="url(#shadow)">
    <!-- Main Ticket/Badge Shape -->
    <path d="M40 60 H260 C271 60, 280 69, 280 80 V220 C280 231, 271 240, 260 240 H40 C29 240, 20 231, 20 220 V80 C20 69, 29 60, 40 60 Z" fill="#ffffff" />
    <!-- Ticket notch left -->
    <path d="M20 135 A 15 15 0 0 1 20 165 Z" fill="url(#grad)" />
    <!-- Ticket notch right -->
    <path d="M280 165 A 15 15 0 0 1 280 135 Z" fill="url(#grad)" />
    <!-- Ticket dotted line separator -->
    <line x1="90" y1="75" x2="90" y2="225" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="8,8" />
    
    <!-- Ticket Queue Number "د" -->
    <text x="55" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="75" font-weight="900" fill="#4f46e5" text-anchor="middle">د</text>
    
    <!-- Line representation inside ticket -->
    <rect x="115" y="95" width="130" height="12" rx="6" fill="#6366f1" />
    <rect x="115" y="125" width="100" height="12" rx="6" fill="#cbd5e1" />
    <rect x="115" y="155" width="120" height="12" rx="6" fill="#06b6d4" />
    
    <!-- User icons or dots showing active queue -->
    <circle cx="125" cy="195" r="10" fill="#10b981" />
    <circle cx="155" cy="195" r="10" fill="#cbd5e1" />
    <circle cx="185" cy="195" r="10" fill="#cbd5e1" />
  </g>
</svg>
