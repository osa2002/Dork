name: 📱 Dork Mobile Customer V1 CI

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-verify-and-build:
    name: 📱 Flutter Analyze, Test & Android APK Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java (v17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🦋 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🔍 Verify Flutter & Dart Tooling
        run: |
          flutter --version
          dart --version
          java -version

      - name: 📦 Resolve Flutter Dependencies
        run: flutter pub get

      - name: 🔍 Static Analysis
        run: flutter analyze

      - name: 🧪 Execute Flutter Unit Tests
        run: flutter test --coverage

      - name: 🏗️ Initialize Android Scaffolding if Needed
        run: |
          if [ ! -d "android" ]; then
            echo "::notice:: Generating Android platform embedding files..."
            flutter create --platforms=android --org=com.dork.customer .
          fi

      - name: 🛠️ Compile Debug APK
        run: flutter build apk --debug

      - name: 🚀 Compile Release APK
        run: flutter build apk --release

      - name: 📤 Upload Mobile Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dork-customer-mobile-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 14
